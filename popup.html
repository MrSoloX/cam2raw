<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; width: 300px; margin: 15px; background-color: #f9f9f9; }
        h3 { margin: 0 0 10px 0; color: #222; font-size: 14px; text-align: center; }
        button { color: white; border: none; padding: 10px; font-size: 13px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin: 5px 0; transition: background 0.2s; }
        .btn-off { background-color: #00cc66; }
        .btn-off:hover { background-color: #00994d; }
        .btn-on { background-color: #ff3333; }
        .btn-on:hover { background-color: #cc0000; }
        .btn-file { background-color: #4a90e2; }
        .btn-file:hover { background-color: #357abd; }
        .btn-file:disabled { background-color: #aaa; cursor: not-allowed; }
        .btn-clear { background-color: #888; font-size: 11px; padding: 6px; }
        .btn-clear:hover { background-color: #666; }
        .status { margin: 8px 0; font-size: 11px; font-weight: bold; text-align: center; }
        .mode-section { margin: 12px 0; padding: 10px; background: #fff; border-radius: 5px; border: 1px solid #ddd; }
        .mode-section h4 { margin: 0 0 8px 0; font-size: 12px; color: #333; }
        .mode-section label { display: block; font-size: 11px; margin: 5px 0; color: #555; }
        .file-input { width: 100%; font-size: 10px; margin: 3px 0; }
        .file-name { font-size: 10px; color: #666; margin: 3px 0; font-style: italic; }
        .disabled { opacity: 0.5; pointer-events: none; }
        .debug-log { background: #1e1e1e; color: #0f0; font-family: monospace; font-size: 9px; padding: 5px; margin-top: 10px; max-height: 150px; overflow-y: auto; border-radius: 3px; }
    </style>
</head>
<body>
    <h3>Управление камерой</h3>
    
    <button id="activate-btn" class="btn-off">Проверка...</button>
    <div id="status" class="status">Ожидание...</div>

    <div id="modes-section" class="mode-section disabled">
        <h4>Режим подмены:</h4>
        
        <label>Режим 1: Видео/изображение вместо камеры</label>
        <input type="file" id="video-file" class="file-input" accept="video/*,image/*">
        <div id="video-file-name" class="file-name"></div>
        <button id="use-video-btn" class="btn-file" style="font-size: 11px; padding: 6px;">Использовать как камеру</button>
        <button id="clear-video-btn" class="btn-clear">Очистить</button>

        <label style="margin-top: 10px;">Режим 2: Фоновое изображение</label>
        <input type="file" id="bg-file" class="file-input" accept="image/*">
        <div id="bg-file-name" class="file-name"></div>
        <button id="use-bg-btn" class="btn-file" style="font-size: 11px; padding: 6px;">Использовать как фон</button>
        <button id="clear-bg-btn" class="btn-clear">Очистить</button>
    </div>

    <div id="debug-log" class="debug-log"></div>

    <script src="popup.js"></script>
</body>
</html>
